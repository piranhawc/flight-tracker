<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilot Logbook</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#ddd; font-family:'JetBrains Mono',monospace; min-height:100vh; }
  #header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid #141414; }
  #header .left { display:flex; align-items:center; gap:8px; }
  #header .title { font-size:14px; font-weight:800; color:#e63946; letter-spacing:2px; }
  #header .meta { font-size:9px; color:#444; }
  #header .right { display:flex; gap:6px; align-items:center; }
  .btn { background:transparent; border:1px solid #1a1a1a; color:#888; padding:4px 10px; border-radius:2px; cursor:pointer; font-size:10px; font-family:inherit; text-decoration:none; }
  .btn:hover { border-color:#333; color:#bbb; }
  .btn.primary { background:#1a0a0e; border-color:#e63946; color:#e63946; }
  .btn.primary:hover { background:#280a0e; }

  /* Login */
  #login { max-width:340px; margin:80px auto; padding:24px; background:#0f0f0f; border:1px solid #1f1f1f; border-radius:6px; }
  #login h2 { font-size:14px; color:#e63946; letter-spacing:2px; margin-bottom:14px; }
  #login input { width:100%; padding:8px 10px; background:#080808; border:1px solid #222; color:#ddd; border-radius:3px; font-family:inherit; font-size:12px; margin-bottom:10px; }
  #login button { width:100%; padding:8px; background:#e63946; border:none; color:#000; font-weight:700; border-radius:3px; cursor:pointer; font-family:inherit; }
  #login .err { color:#f44; font-size:10px; margin-top:8px; min-height:14px; }

  /* Main layout */
  #app { display:none; }
  #app.shown { display:block; }
  #status { padding:6px 14px; font-size:10px; color:#06d6a0; min-height:18px; }
  #main { display:flex; gap:14px; padding:0 14px 20px; }
  #legs-pane { flex:2; min-width:0; }
  #crew-pane { flex:1; min-width:280px; max-width:420px; }
  @media (max-width:900px) { #main { flex-direction:column; } #crew-pane { max-width:none; } }

  h2.section { font-size:12px; color:#e63946; letter-spacing:1.5px; margin-bottom:8px; padding:4px 0; border-bottom:1px solid #1a1a1a; }

  /* Legs table */
  table.legs { width:100%; border-collapse:collapse; font-size:10px; }
  table.legs th { text-align:left; color:#666; font-weight:600; padding:6px 6px; border-bottom:1px solid #1a1a1a; font-size:9px; letter-spacing:.5px; text-transform:uppercase; }
  table.legs td { padding:6px 6px; border-bottom:1px solid #141414; vertical-align:top; }
  table.legs tr:hover td { background:#0e0e0e; }
  table.legs .col-flight { color:#bbb; font-weight:700; }
  table.legs .col-route { color:#888; }
  table.legs .col-time { color:#aaa; font-size:10px; white-space:nowrap; }
  table.legs .col-time .actual { color:#06d6a0; }
  table.legs .col-time .sched { color:#666; }
  table.legs .col-time .delta { color:#ffd166; font-size:9px; margin-left:4px; }
  table.legs .col-aircraft { color:#888; font-size:9px; }
  table.legs .col-crew { color:#ddd; }
  table.legs .crew-pill { display:inline-block; padding:2px 6px; margin:1px 2px 1px 0; background:#1a1208; border:1px solid #2a1a08; color:#ffd166; border-radius:2px; font-size:9px; cursor:pointer; }
  table.legs .crew-pill:hover { background:#281a08; }
  table.legs .crew-pill.repeat { background:#0a2018; border-color:#0a4030; color:#06d6a0; }
  /* FA pills use the same yellow base as pilots — yellow = "currently flying
     with this person" across the whole trip. Green .repeat overlay below
     still kicks in if the FA was on a PRIOR trip. */
  table.legs .crew-edit { background:#080808; border:1px solid #222; color:#ddd; padding:3px 6px; font-size:9px; font-family:inherit; width:100%; border-radius:2px; }
  table.legs .badge-dh { background:#222; color:#888; font-size:8px; padding:1px 4px; border-radius:2px; margin-left:4px; letter-spacing:.5px; }
  table.legs .badge-upcoming { background:#1a1208; color:#ffd166; font-size:8px; padding:1px 4px; border-radius:2px; margin-left:4px; letter-spacing:.5px; font-weight:700; }
  table.legs tr.upcoming td { background:#0d0a05; }
  table.legs tr.upcoming td:first-child { border-left:2px solid #ffd166; }
  table.legs .badge-removed { background:#1a0808; color:#f44; font-size:8px; padding:1px 4px; border-radius:2px; margin-left:4px; letter-spacing:.5px; font-weight:700; }
  table.legs .badge-fa-ok { background:#0a2018; color:#06d6a0; font-size:8px; padding:1px 4px; border-radius:2px; margin-left:4px; letter-spacing:.5px; }
  table.legs .badge-fa-short { background:#1a1208; color:#ffd166; font-size:8px; padding:1px 4px; border-radius:2px; margin-left:4px; letter-spacing:.5px; }
  table.legs .row-action { display:inline-block; margin-left:6px; color:#444; font-size:11px; cursor:pointer; text-decoration:none; padding:0 3px; }
  table.legs .row-action:hover { color:#f44; }
  table.legs tr.removed .row-action:hover { color:#06d6a0; }
  table.legs tr.removed td { opacity:.45; }
  table.legs tr.removed td:first-child { border-left:2px solid #f44; }
  table.legs tr.removed .col-flight, table.legs tr.removed .col-route { text-decoration:line-through; }

  /* Crew list */
  .crew-card { background:#0e0e0e; border:1px solid #1a1a1a; border-radius:4px; padding:10px 12px; margin-bottom:8px; }
  .crew-card .crew-name { color:#ffd166; font-weight:700; font-size:12px; letter-spacing:.5px; }
  .crew-card .crew-stats { color:#666; font-size:9px; margin-top:2px; }
  .crew-card .crew-notes { width:100%; min-height:50px; margin-top:6px; padding:6px; background:#080808; border:1px solid #1a1a1a; color:#ccc; font-family:inherit; font-size:10px; border-radius:2px; resize:vertical; }
  .crew-card .crew-flights { margin-top:6px; font-size:9px; color:#666; max-height:80px; overflow-y:auto; }
  .crew-card .crew-flights .f { color:#888; padding:1px 0; }
  .crew-card .crew-flights .f .d { color:#555; margin-right:6px; }

  .empty { text-align:center; color:#444; font-size:10px; padding:30px; }
</style>
</head>
<body>

<div id="header">
  <div class="left">
    <span style="font-size:18px">📔</span>
    <span class="title">PILOT LOG</span>
    <span class="meta" id="meta-info"></span>
  </div>
  <div class="right">
    <span class="meta" title="Build version">v2026-06-08.2</span>
    <a class="btn" href="/" title="Back to flights">← FLIGHTS</a>
    <a class="btn" href="/career-me.html" title="Retirement & upgrade projection" style="text-decoration:none">📈 RETIREMENT</a>
    <span class="meta" id="apa-stats-summary" style="display:none"></span>
    <button class="btn" id="apa-backfill-btn" onclick="runBackfillFromApa()" style="display:none" title="Pull ~28 months of completed flight history from APA logbook with real captain names + tails. Takes 1-2 min.">📚 BACKFILL FROM APA</button>
    <button class="btn" id="apa-sync-current-btn" onclick="runApaSyncCurrentMonth()" style="display:none" title="Sync current AND previous month from APA. Catches premium trips picked up around month boundaries.">↻ RECENT</button>
    <button class="btn" id="import-btn" onclick="runImportFromCalendar()" style="display:none" title="Pull completed flights from calendar, fill crew from APA, fetch FA actuals for the last 14 days">📥 CALENDAR</button>
    <button class="btn" id="import-force-btn" onclick="runImportFromCalendar(true)" style="display:none" title="Re-import everything, overwriting auto-filled crew (preserves notes)">⟳ FORCE</button>
    <button class="btn" id="sync-apa-btn" onclick="runSyncApaCrew()" style="display:none" title="Fill crew on existing legs that have empty crew arrays">⛏ SYNC APA CREW</button>
    <button class="btn" id="reconcile-btn" onclick="triggerReconcile()" style="display:none" title="Check apa-sabre for FTG'd/dropped legs and soft-delete them">⚖ RECONCILE</button>
    <button class="btn" id="removed-toggle" onclick="toggleRemoved()" style="display:none" title="Show legs that were FTG'd or dropped (soft-deleted)">👁 SHOW REMOVED</button>
    <button class="btn" id="logout-btn" onclick="logout()" style="display:none">LOGOUT</button>
  </div>
</div>

<div id="login">
  <h2>UNLOCK</h2>
  <form id="login-form">
    <input type="password" id="password" placeholder="password" autofocus autocomplete="current-password">
    <button type="submit">SIGN IN</button>
  </form>
  <div class="err" id="login-err"></div>
</div>

<div id="app">
  <div id="status"></div>
  <div id="main">
    <div id="legs-pane">
      <h2 class="section">FLIGHTS</h2>
      <div id="legs-host"></div>
    </div>
    <div id="crew-pane">
      <h2 class="section">CREW</h2>
      <div id="crew-host"></div>
    </div>
  </div>
</div>

<script>
var token = localStorage.getItem("logbook-token") || null;
var legsData = [];
var crewData = [];
var crewIndex = {};
var crewByDate = {}; // crewName → sorted list of flight dates flown together
var crewByTrip = {}; // crewName → array of {date, trip} where trip = "ep/seq" or null

function authHeaders() { return token ? { "Authorization": "Bearer " + token } : {}; }

function lbTitleCase(s) {
  return String(s || "").toLowerCase().replace(/\b([a-z])/g, function(_, c) { return c.toUpperCase(); });
}
// Crew strings are stored as "CA · Brent Holding" (seat prefix) so we can
// surface pilot/FA positions in the UI without losing per-person grouping.
// Bare names pass through unchanged. Anything that needs to identify a
// PERSON (notes lookup, repeat-detection) uses the bare name.
function splitCrewName(s) {
  if (!s) return { seat: "", name: "" };
  // Accepts seat labels like CA, FO, RC, FA1, FA2 ... or legacy "01"/"02".
  var m = /^([A-Z]{1,3}\d?|\d{1,2})\s*·\s*(.+)$/.exec(String(s).trim());
  if (m) return { seat: m[1].toUpperCase(), name: m[2].trim() };
  return { seat: "", name: String(s).trim() };
}
function isFASeat(seat) {
  if (!seat) return false;
  return /^FA\d+$/.test(seat) || /^\d{1,2}$/.test(seat);
}
function bareCrewName(s) {
  return splitCrewName(s).name;
}
function displayNameForCrew(rawName) {
  if (!rawName) return "";
  var parts = splitCrewName(rawName);
  var name = parts.name;
  if (name === name.toUpperCase() && name.length > 1) name = lbTitleCase(name);
  if (!parts.seat) return name;
  var seatDisplay = parts.seat;
  // Normalize legacy bare "01"/"02" to "FA1"/"FA2" in the rendered label.
  var bareNum = /^0?(\d{1,2})$/.exec(seatDisplay);
  if (bareNum) seatDisplay = "FA" + bareNum[1];
  var isFA = isFASeat(parts.seat);
  // Seat-label color: pilots in green, FAs in yellow (matches the pill base
  // colors set in the table CSS — yellow means "currently on this trip").
  var color = isFA ? "#ffd166" : "#06d6a0";
  return '<span style="color:' + color + ';font-weight:700;margin-right:4px">' + seatDisplay + '</span>' + name;
}
function setStatus(msg, color) {
  var s = document.getElementById("status");
  s.textContent = msg || "";
  s.style.color = color || "#06d6a0";
}
function logout() {
  localStorage.removeItem("logbook-token");
  token = null;
  document.getElementById("app").classList.remove("shown");
  document.getElementById("login").style.display = "block";
  document.getElementById("logout-btn").style.display = "none";
  document.getElementById("sync-apa-btn").style.display = "none";
  document.getElementById("import-btn").style.display = "none";
  document.getElementById("import-force-btn").style.display = "none";
  document.getElementById("apa-backfill-btn").style.display = "none";
  document.getElementById("apa-sync-current-btn").style.display = "none";
  document.getElementById("apa-stats-summary").style.display = "none";
}

document.getElementById("login-form").addEventListener("submit", async function(e) {
  e.preventDefault();
  var pw = document.getElementById("password").value;
  document.getElementById("login-err").textContent = "";
  var resp = await fetch("/api/logbook/auth", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: pw }),
  });
  if (!resp.ok) {
    document.getElementById("login-err").textContent = "incorrect password";
    return;
  }
  var d = await resp.json();
  token = d.token;
  localStorage.setItem("logbook-token", token);
  initApp();
});

async function initApp() {
  var ok = await loadAll();
  if (!ok) {
    logout();
    document.getElementById("login-err").textContent = "session expired — sign in again";
    return;
  }
  document.getElementById("login").style.display = "none";
  document.getElementById("app").classList.add("shown");
  document.getElementById("logout-btn").style.display = "";
  document.getElementById("sync-apa-btn").style.display = "";
  document.getElementById("import-btn").style.display = "";
  document.getElementById("import-force-btn").style.display = "";
  document.getElementById("apa-backfill-btn").style.display = "";
  document.getElementById("apa-sync-current-btn").style.display = "";
  document.getElementById("reconcile-btn").style.display = "";
  loadApaStats();
}

var showRemoved = false;
var removedCount = 0;

async function loadAll() {
  var qs = showRemoved ? "?include_removed=1" : "";
  var [legsResp, crewResp] = await Promise.all([
    fetch("/api/logbook/legs" + qs, { headers: authHeaders() }),
    fetch("/api/logbook/crew", { headers: authHeaders() }),
  ]);
  if (legsResp.status === 401 || crewResp.status === 401) return false;
  var legsBody = await legsResp.json();
  legsData = legsBody.legs || [];
  removedCount = legsBody.removed_hidden || 0;
  crewData = (await crewResp.json()).crew || [];
  buildCrewIndex();
  document.getElementById("meta-info").textContent =
    legsData.length + " legs · " + crewData.length + " crew" +
    (removedCount > 0 && !showRemoved ? " · " + removedCount + " removed (hidden)" : "");
  updateRemovedToggle();
  renderLegs();
  renderCrew();
  return true;
}

function toggleRemoved() {
  showRemoved = !showRemoved;
  loadAll();
}

function updateRemovedToggle() {
  var btn = document.getElementById("removed-toggle");
  if (!btn) return;
  btn.textContent = showRemoved ? "👁 HIDE REMOVED" : "👁 SHOW REMOVED";
  btn.style.display = (showRemoved || removedCount > 0) ? "" : "none";
}

async function triggerReconcile() {
  setStatus("Reconciling...", "#ffd166");
  var r = await fetch("/api/logbook/reconcile", {
    method: "POST",
    headers: authHeaders(),
  });
  if (!r.ok) { setStatus("Reconcile failed", "#f44"); return; }
  var d = await r.json();
  setStatus("Reconciled: " + (d.removed || 0) + " removed, " + (d.restored || 0) + " restored, " + (d.kept || 0) + " kept");
  await loadAll();
}

async function markLegRemoved(legId) {
  var reason = prompt("Reason (OX, RV, trade, manual drop, ...):", "OX");
  if (reason == null) return;
  reason = reason.trim() || "Manually marked removed";
  var r = await fetch("/api/logbook/legs/" + encodeURIComponent(legId) + "/remove", {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
    body: JSON.stringify({ reason: reason }),
  });
  if (!r.ok) { setStatus("Remove failed", "#f44"); return; }
  setStatus("Marked removed: " + reason);
  await loadAll();
}

async function restoreLeg(legId) {
  var r = await fetch("/api/logbook/legs/" + encodeURIComponent(legId) + "/restore", {
    method: "POST",
    headers: authHeaders(),
  });
  if (!r.ok) { setStatus("Restore failed", "#f44"); return; }
  setStatus("Restored");
  await loadAll();
}

function buildCrewIndex() {
  crewIndex = {};
  crewByDate = {};
  crewByTrip = {};
  crewData.forEach(function(c) {
    crewIndex[c.name] = c;
    crewByDate[c.name] = (c.flights || []).map(function(f) { return f.date; }).sort();
    crewByTrip[c.name] = (c.flights || []).map(function(f) {
      var trip = (f.ep != null && f.seq != null) ? (f.ep + "/" + f.seq) : null;
      return { date: f.date || "", trip: trip };
    }).sort(function(a, b) { return a.date.localeCompare(b.date); });
  });
}

// Have we flown with this person before? Behavior depends on seat:
//  - Pilots/RC: "before THIS DATE" — earlier date = repeat.
//  - FAs: "on a PRIOR TRIP" — multiple legs within the same (ep, seq) don't
//    count as a repeat. A different trip-id earlier in time does.
// Legs missing ep/seq fall back to date-based detection.
function flownBeforeWith(rawName, leg) {
  var name = bareCrewName(rawName);
  var seat = splitCrewName(rawName).seat;
  var thisDate = leg && leg.date || "";
  var thisTrip = (leg && leg.ep != null && leg.seq != null) ? (leg.ep + "/" + leg.seq) : null;
  if (isFASeat(seat)) {
    var entries = crewByTrip[name];
    if (!entries) return false;
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      if (!e.date) continue;
      if (e.date >= thisDate) continue;
      // Same trip ID = same trip across multiple legs; don't count.
      if (thisTrip && e.trip && e.trip === thisTrip) continue;
      return true;
    }
    return false;
  }
  var dates = crewByDate[name];
  if (!dates) return false;
  for (var j = 0; j < dates.length; j++) {
    if (dates[j] && dates[j] < thisDate) return true;
  }
  return false;
}

function fmtTime(iso, tz) {
  if (!iso) return "—";
  try {
    return new Date(iso).toLocaleTimeString("en-US", {
      hour:"2-digit", minute:"2-digit", hour12:false, timeZone: tz || undefined
    });
  } catch (e) { return new Date(iso).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false}); }
}
function gateToGate(leg) {
  // APA block time (in minutes) is authoritative when present.
  if (leg.block_min_actual) {
    var h1 = Math.floor(leg.block_min_actual / 60);
    var m1 = leg.block_min_actual % 60;
    return h1 + "h" + (m1 < 10 ? "0" : "") + m1;
  }
  if (!leg.actual_out || !leg.actual_in) return null;
  var ms = new Date(leg.actual_in) - new Date(leg.actual_out);
  if (ms <= 0) return null;
  var h = Math.floor(ms / 3600000);
  var m = Math.round((ms % 3600000) / 60000);
  return h + "h" + (m < 10 ? "0" : "") + m;
}
function aircraftLabel(leg) {
  var tail = leg.tail || leg.registration || leg.aircraft || "";
  var type = leg.aircraft_type || "";
  if (!tail && !type) return "—";
  return tail + (type ? " · " + type : "");
}

// FAA minimum FAs by aircraft type — used to flag "Sabre is short an FA"
// when the cached crew count is below the type's expected number.
function expectedFACount(aircraftType) {
  var t = String(aircraftType || "").toUpperCase().replace(/\s+/g, "");
  if (!t) return null;
  if (t.indexOf("777") === 0 || t.indexOf("B777") === 0) return 8;
  if (t.indexOf("787") === 0 || t.indexOf("B787") === 0) return 6;
  if (t.indexOf("321") >= 0) return 4;
  if (t.indexOf("319") >= 0 || t.indexOf("320") >= 0) return 3;
  if (t.indexOf("737") >= 0 || t.indexOf("738") >= 0) return 3;
  if (t.indexOf("MD") === 0 || t.indexOf("M83") === 0 || t.indexOf("M88") === 0) return 3;
  // Regional jets (CRJ, ERJ, E170/175) — typically 1 FA
  if (t.indexOf("CRJ") === 0 || t.indexOf("CR") === 0) return 1;
  if (t.indexOf("E17") >= 0 || t.indexOf("E175") >= 0 || t.indexOf("E170") >= 0) return 1;
  if (t.indexOf("ERJ") >= 0) return 1;
  return null;
}
function faCountBadge(leg) {
  var expected = expectedFACount(leg.aircraft_type);
  if (!expected) return "";
  var actual = (leg.crew || []).filter(function(n) {
    return /^FA\d+\s*·/.test(String(n));
  }).length;
  var cls = (actual >= expected) ? "badge-fa-ok" : "badge-fa-short";
  return '<span class="' + cls + '" title="' + actual + ' of ' + expected + ' expected FAs">' +
    actual + '/' + expected + ' FA</span>';
}

function renderLegs() {
  var host = document.getElementById("legs-host");
  if (!legsData.length) {
    host.innerHTML = '<div class="empty">No legs yet. Click <b>📚 BACKFILL FROM APA</b> to import ~28 months of flight history with real captain names and tails.</div>';
    return;
  }
  // Group legs by date for readability
  var rows = ["<table class='legs'><thead><tr>" +
    "<th>Date</th><th>Flight</th><th>Route</th>" +
    "<th>Out</th><th>In</th><th>Gate-to-gate</th>" +
    "<th>Aircraft</th><th>Crew</th></tr></thead><tbody>"];
  legsData.forEach(function(l) {
    var dateStr = l.date || (l.scheduled_out || "").split("T")[0] || "—";
    var aircraft = aircraftLabel(l);
    var actOut = l.actual_out ? fmtTime(l.actual_out) : "";
    var schedOut = l.scheduled_out ? fmtTime(l.scheduled_out) : "—";
    var actIn = l.actual_in ? fmtTime(l.actual_in) : "";
    var schedIn = l.scheduled_in ? fmtTime(l.scheduled_in) : "—";
    var g2g = gateToGate(l) || "—";
    var dh = l.isDH ? '<span class="badge-dh">DH</span>' : '';
    var upcomingBadge = l._upcoming ? '<span class="badge-upcoming">UPCOMING</span>' : '';
    var removedBadge = l._removed_at
      ? '<span class="badge-removed" title="' + String(l._removed_reason || "").replace(/"/g, "&quot;") + '">' +
          String((l._reconciliation_status || "removed")).toUpperCase() + '</span>'
      : '';
    var rowAction = l._removed_at
      ? '<a class="row-action" title="Restore" onclick="restoreLeg(\'' + l.id + '\')">↻</a>'
      : '<a class="row-action" title="Mark removed (OX, trade, manual drop, …)" onclick="markLegRemoved(\'' + l.id + '\')">✕</a>';
    var faBadge = !l._removed_at ? faCountBadge(l) : '';

    var crewPills = (l.crew || []).map(function(rawName) {
      var bare = bareCrewName(rawName);
      var seen = flownBeforeWith(rawName, l);
      var display = displayNameForCrew(rawName);
      var seatRaw = splitCrewName(rawName).seat;
      var dataSeat = isFASeat(seatRaw) ? "FA" : (seatRaw || "");
      return '<span class="crew-pill ' + (seen ? "repeat" : "") + '" ' +
        'data-seat="' + dataSeat + '" ' +
        'onclick="scrollToCrew(\'' + bare.replace(/'/g, "\\'") + '\')" ' +
        'title="' + (seen ? "Flown together before" : "First flight together") + '">' +
        display + '</span>';
    }).join("");
    var apaFlag = l._apa_sourced ? '<span title="from APA Sabre · click ⛏ SYNC APA CREW to persist" style="color:#06d6a0;margin-right:4px;font-size:10px">⚡</span>' : '';
    var crewEditId = "crew-edit-" + l.id;

    var rowCls = l._removed_at ? "removed" : (l._upcoming ? "upcoming" : "");
    rows.push("<tr" + (rowCls ? " class='" + rowCls + "'" : "") + ">" +
      "<td>" + dateStr + "</td>" +
      "<td class='col-flight'>" + (l.flight || "—") + dh + upcomingBadge + removedBadge + " " + rowAction + "</td>" +
      "<td class='col-route'>" + (l.dep || "?") + "→" + (l.arr || "?") + "</td>" +
      "<td class='col-time'>" + (actOut ? '<span class="actual">' + actOut + '</span>' : '<span class="sched">' + schedOut + '</span>') + "</td>" +
      "<td class='col-time'>" + (actIn ? '<span class="actual">' + actIn + '</span>' : '<span class="sched">' + schedIn + '</span>') + "</td>" +
      "<td class='col-time'>" + g2g + "</td>" +
      "<td class='col-aircraft'>" + aircraft + faBadge + "</td>" +
      "<td class='col-crew'>" +
        '<div>' + apaFlag + crewPills + '</div>' +
        '<input class="crew-edit" id="' + crewEditId + '" placeholder="add crew (comma-separated)" ' +
          'value="' + (l.crew || []).join(", ").replace(/"/g, "&quot;") + '" ' +
          'onblur="saveCrewForLeg(\'' + l.id + '\', this.value)" ' +
          'onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}">' +
      "</td>" +
    "</tr>");
  });
  rows.push("</tbody></table>");
  host.innerHTML = rows.join("");
}

async function saveCrewForLeg(legId, raw) {
  var names = raw.split(",").map(function(s) { return s.trim(); }).filter(Boolean);
  // Optimistic local update
  var leg = legsData.find(function(l) { return l.id === legId; });
  if (leg) leg.crew = names;
  var resp = await fetch("/api/logbook/legs/" + encodeURIComponent(legId), {
    method: "POST",
    headers: Object.assign({ "Content-Type":"application/json" }, authHeaders()),
    body: JSON.stringify({ crew: names }),
  });
  if (!resp.ok) {
    setStatus("Failed to save crew", "#f44");
    return;
  }
  // Reload crew side panel to reflect new flights together
  await loadAll();
  setStatus("Crew saved", "#06d6a0");
  setTimeout(function() { setStatus(""); }, 2000);
}

function renderCrew() {
  var host = document.getElementById("crew-host");
  if (!crewData.length) {
    host.innerHTML = '<div class="empty">Add crew to a flight to see history.</div>';
    return;
  }
  host.innerHTML = crewData.map(function(c) {
    var stats = (c.flights ? c.flights.length : 0) + " flight" + (c.flights && c.flights.length !== 1 ? "s" : "");
    var range = c.firstSeen && c.lastSeen ?
      (c.firstSeen === c.lastSeen ? c.firstSeen : c.firstSeen + " — " + c.lastSeen) : "";
    var safeName = c.name.replace(/"/g, "&quot;");
    var notesId = "notes-" + c.name.replace(/[^a-z0-9]/gi, "_");
    var flightsHtml = (c.flights || []).slice(0, 12).map(function(f) {
      return '<div class="f"><span class="d">' + f.date + '</span>' + f.flight + ' ' + f.dep + '→' + f.arr + '</div>';
    }).join("");
    return '<div class="crew-card" id="card-' + c.name.replace(/[^a-z0-9]/gi, "_") + '">' +
      '<div class="crew-name">' + c.name + '</div>' +
      '<div class="crew-stats">' + stats + (range ? " · " + range : "") + '</div>' +
      '<textarea class="crew-notes" id="' + notesId + '" placeholder="notes about this person…" ' +
        'onblur="saveCrewNotes(\'' + safeName + '\', this.value)">' +
        (c.notes || "").replace(/</g, "&lt;") + '</textarea>' +
      '<div class="crew-flights">' + flightsHtml +
        ((c.flights && c.flights.length > 12) ? '<div class="f"><span class="d">…</span>' + (c.flights.length - 12) + ' more</div>' : '') +
      '</div>' +
    '</div>';
  }).join("");
}

async function saveCrewNotes(name, notes) {
  var resp = await fetch("/api/logbook/crew/" + encodeURIComponent(name), {
    method: "POST",
    headers: Object.assign({ "Content-Type":"application/json" }, authHeaders()),
    body: JSON.stringify({ notes: notes }),
  });
  if (!resp.ok) { setStatus("Failed to save notes", "#f44"); return; }
  if (crewIndex[name]) crewIndex[name].notes = notes;
  setStatus("Notes saved", "#06d6a0");
  setTimeout(function() { setStatus(""); }, 1500);
}

function scrollToCrew(name) {
  var id = "card-" + name.replace(/[^a-z0-9]/gi, "_");
  var el = document.getElementById(id);
  if (el) {
    el.scrollIntoView({ behavior:"smooth", block:"center" });
    el.style.outline = "1px solid #ffd166";
    setTimeout(function() { el.style.outline = ""; }, 1500);
  }
}

// --- Sync flow: pull legs from ICS, fetch FA actual times, push to logbook ---
function parseEventToLeg(ev) {
  var s = ev.summary || "";
  var m = s.match(/^AA\s+(\d{1,4})\s+(?:\(DH\)\s+)?([A-Z]{3})-([A-Z]{3})/);
  if (!m) return null;
  var num = m[1], dep = m[2], arr = m[3];
  var isDH = s.includes("(DH)");
  var date = (ev.start || "").split("T")[0];
  if (!date) return null;
  return {
    // Prefer the calendar UID for idempotent IDs across re-imports; fall back
    // to a deterministic composite if the event has no UID (rare).
    id: ev.uid || (date + "-AA" + num + "-" + dep + "-" + arr),
    date: date,
    flight: "AA" + num,
    flight_number: num,
    dep: dep,
    arr: arr,
    isDH: isDH,
    scheduled_out: ev.start || null,
    scheduled_in: ev.end || null,
  };
}

async function loadApaStats() {
  try {
    var r = await fetch("/api/logbook/apa-stats", { headers: authHeaders() });
    if (!r.ok) return;
    var s = await r.json();
    if (!s || s.totalTime == null) return;
    var hours = Math.round((s.totalTime / 60) * 10) / 10;
    var miles = s.totalDistance ? Math.round(s.totalDistance) : 0;
    var pax = s.totalPassengerCount || 0;
    var el = document.getElementById("apa-stats-summary");
    el.textContent = "APA · " + hours + " hr · " + miles.toLocaleString() + " mi · " + pax.toLocaleString() + " pax";
    el.style.display = "";
  } catch (e) {}
}

async function runBackfillFromApa() {
  if (!confirm("Backfill logbook from APA? Walks every month going back ~28 months (Oct 2023 → today) and may take 1–2 minutes. Manual edits are preserved.")) return;
  var btn = document.getElementById("apa-backfill-btn");
  btn.disabled = true;
  var original = btn.textContent;
  btn.textContent = "⏳ starting...";
  try {
    var r = await fetch("/api/logbook/backfill-from-apa", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
      body: JSON.stringify({ force: false }),
    });
    var result = await r.json();
    if (!r.ok) { setStatus("Backfill failed: " + (result.error || r.status), "#f44"); return; }
    setStatus("Backfill running in background · watch container logs for progress", "#06d6a0");
    // Poll legs every 10 sec to update count as legs land. Stop at 6 min.
    var startCount = legsData.length;
    var attempts = 0;
    btn.textContent = "⏳ running...";
    var poll = setInterval(async function() {
      await loadAll();
      var diff = legsData.length - startCount;
      btn.textContent = "⏳ " + diff + " new · running...";
      attempts++;
      if (attempts >= 36) { // ~6 min
        clearInterval(poll);
        btn.disabled = false;
        btn.textContent = original;
        setStatus("Backfill polling stopped — refresh to check final count", "#888");
        await loadAll();
        await loadApaStats();
      }
    }, 10000);
  } catch (e) {
    setStatus("Backfill error: " + e.message, "#f44");
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function runApaSyncCurrentMonth() {
  var btn = document.getElementById("apa-sync-current-btn");
  btn.disabled = true;
  var original = btn.textContent;
  btn.textContent = "⏳ syncing...";
  try {
    var r = await fetch("/api/logbook/sync-current-month", {
      method: "POST",
      headers: authHeaders(),
    });
    var result = await r.json();
    if (r.ok) {
      setStatus("APA month sync · " + result.created + " new · " + result.updated + " updated · " +
                result.skipped + " preserved · " + result.deadhead + " DH filtered", "#06d6a0");
      await loadAll();
      await loadApaStats();
    } else {
      setStatus("APA month sync failed: " + (result.error || r.status), "#f44");
    }
  } catch (e) {
    setStatus("APA month sync error: " + e.message, "#f44");
  } finally {
    btn.disabled = false;
    btn.textContent = original;
    setTimeout(function() { setStatus(""); }, 6000);
  }
}

async function runImportFromCalendar(force) {
  var prompt = force
    ? "FORCE re-import: overwrites every leg's auto-filled crew with the latest from APA. Notes are preserved. Continue?"
    : "Import completed flights from the calendar? Creates logbook entries, fills crew from APA, and queues FA gate-to-gate actuals for the last 14 days. Notes are preserved.";
  if (!confirm(prompt)) return;
  var btnId = force ? "import-force-btn" : "import-btn";
  var btn = document.getElementById(btnId);
  btn.disabled = true;
  var original = btn.textContent;
  btn.textContent = "⏳ importing...";
  try {
    var r = await fetch("/api/logbook/import-from-calendar", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
      body: JSON.stringify({ force: !!force }),
    });
    var result = await r.json();
    if (r.ok) {
      setStatus("Import · " + result.created + " new · " + result.updated + " updated · " +
                result.deadhead + " DH skipped · " + result.no_crew + " w/o crew · " +
                "FA actuals queued in background", "#06d6a0");
      await loadAll();
    } else {
      setStatus("Import failed: " + (result.error || r.status), "#f44");
    }
  } catch (e) {
    setStatus("Import error: " + e.message, "#f44");
  } finally {
    btn.disabled = false;
    btn.textContent = original;
    setTimeout(function() { setStatus(""); }, 8000);
  }
}

async function runSyncApaCrew() {
  if (!confirm("Sync crew from APA Sabre cache for legs that have no crew yet? Already-filled legs will not be touched.")) return;
  var btn = document.getElementById("sync-apa-btn");
  btn.disabled = true;
  var originalText = btn.textContent;
  btn.textContent = "⏳ syncing...";
  try {
    var r = await fetch("/api/logbook/sync-apa-crew", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
      body: JSON.stringify({ force: false }),
    });
    var result = await r.json();
    if (r.ok) {
      setStatus("APA sync · " + result.updated + " updated · " + result.skipped + " skipped · " + result.no_data + " no APA data", "#06d6a0");
      await loadAll();
    } else {
      setStatus("APA sync failed: " + (result.error || r.status), "#f44");
    }
  } catch (e) {
    setStatus("APA sync error: " + e.message, "#f44");
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
    setTimeout(function() { setStatus(""); }, 5000);
  }
}

if (token) {
  initApp();
} else {
  document.getElementById("login").style.display = "block";
}
